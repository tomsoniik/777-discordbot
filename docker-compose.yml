version: '3.8'

services:
  # ==============================
  # BAZY DANYCH (PostgreSQL)
  # ==============================
  db-bot:
    image: postgres:15-alpine
    container_name: db-bot
    restart: always
    environment:
      POSTGRES_USER: bot_user
      POSTGRES_PASSWORD: bot_password
      POSTGRES_DB: bot_db
    ports:
      - "5432:5432"
    volumes:
      - db_bot_data:/var/lib/postgresql/data
    networks:
      - devops-network

  db-frontend:
    image: postgres:15-alpine
    container_name: db-frontend
    restart: always
    environment:
      POSTGRES_USER: front_user
      POSTGRES_PASSWORD: front_password
      POSTGRES_DB: frontend_db
    ports:
      - "5433:5432" # Uruchamiamy na innym porcie na hoście (5433) by nie było konfliktu
    volumes:
      - db_front_data:/var/lib/postgresql/data
    networks:
      - devops-network

  # ==============================
  # APLIKACJE (Bot i Frontend)
  # ==============================
  bot:
    build: 
      context: ./bot
      dockerfile: Dockerfile
    container_name: bot-service
    restart: unless-stopped
    depends_on:
      - db-bot
    environment:
      # Podpinamy kontener do odpowiedniej bazy
      - DATABASE_URL=postgresql://bot_user:bot_password@db-bot:5432/bot_db?schema=public
      # Token bota trzeba przekazać - w środowisku prod, podmieni się z .env z systemu
      - DISCORD_TOKEN=${DISCORD_TOKEN}
      - STEAM_API_KEY=${STEAM_API_KEY}
    networks:
      - devops-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend-service
    restart: unless-stopped
    depends_on:
      - db-frontend
    environment:
      - DATABASE_URL=postgresql://front_user:front_password@db-frontend:5432/frontend_db?schema=public
      - NEXTAUTH_URL=http://localhost:3000
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
    ports:
      - "3000:3000"
    networks:
      - devops-network

volumes:
  db_bot_data:
  db_front_data:

networks:
  devops-network:
    driver: bridge
